description: Cisco Control Hub is the administration console for Webex services. Programmatic access is delivered
  through the Webex Admin and adjacent REST APIs at webexapis.com — covering people, organizations, locations, workspaces,
  devices, licenses, calling configuration, audit events, and analytics reports. Authentication uses OAuth 2.0 access
  tokens or service-app tokens scoped to the organization.
